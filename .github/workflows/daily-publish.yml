name: Daily DeepSeek article publishing

on:
  schedule:
    # GitHub Actions cron uses UTC. 19:17 UTC is 03:17 Asia/Shanghai (off-peak).
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      start_offset:
        description: 'Marketplace resume offset (diagnostics/recovery only)'
        required: false
        default: '0'
      dry_run:
        description: 'Validate research and DeepSeek output without publishing'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-ai-publish
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      # DeepSeek API model ID for the current DeepSeek-V4.1-Flash release.
      DEEPSEEK_MODEL: deepseek-flash
      AI_ARTICLE_LANGUAGE: ${{ vars.AI_ARTICLE_LANGUAGE || 'en' }}
      DIGISTORE24_AFFILIATE_ID: ${{ vars.DIGISTORE24_AFFILIATE_ID || 'adminstore' }}
      CATALOG_START_OFFSET: ${{ inputs.start_offset || '0' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      PUBLISH_API_URL: ${{ vars.AUTOMATION_API_URL || vars.NEXT_PUBLIC_SITE_URL }}
      AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
      AI_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate and publish one gated article
        run: npm run daily:publish
      - name: Verify publication in production D1
        if: ${{ !inputs.dry_run }}
        run: npm run daily:verify
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-publish-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
