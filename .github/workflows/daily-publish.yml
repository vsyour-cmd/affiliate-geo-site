name: Daily DeepSeek article publishing

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      start_offset:
        description: 'Marketplace resume offset (diagnostics/recovery only)'
        required: false
        default: '0'

concurrency:
  group: daily-ai-publish
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
      AI_ARTICLE_LANGUAGE: ${{ vars.AI_ARTICLE_LANGUAGE || 'en' }}
      DIGISTORE24_AFFILIATE_ID: ${{ vars.DIGISTORE24_AFFILIATE_ID || 'adminstore' }}
      CATALOG_START_OFFSET: ${{ inputs.start_offset || '0' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      PUBLISH_API_URL: ${{ vars.AUTOMATION_API_URL || vars.NEXT_PUBLIC_SITE_URL }}
      AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Sync complete Digistore24 Marketplace catalog
        id: catalog_sync
        continue-on-error: true
        run: npm run daily:catalog-sync
      - name: Generate and publish one gated article
        run: npm run daily:publish
      - name: Verify publication in production D1
        run: npm run daily:verify
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-publish-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Report catalog sync failure
        if: steps.catalog_sync.outcome == 'failure'
        run: exit 1
