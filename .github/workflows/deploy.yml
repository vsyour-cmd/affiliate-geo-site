name: Deploy production Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured in the production environment."
            exit 1
          fi
          NORMALIZED_TOKEN="${CLOUDFLARE_API_TOKEN#Bearer }"
          NORMALIZED_TOKEN="${NORMALIZED_TOKEN#bearer }"
          NORMALIZED_TOKEN="${NORMALIZED_TOKEN%\"}"
          NORMALIZED_TOKEN="${NORMALIZED_TOKEN#\"}"
          NORMALIZED_TOKEN="$(printf '%s' "$NORMALIZED_TOKEN" | tr -d '\r\n')"
          echo "::add-mask::$NORMALIZED_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$NORMALIZED_TOKEN" >> "$GITHUB_ENV"
          export CLOUDFLARE_API_TOKEN="$NORMALIZED_TOKEN"
          npx wrangler whoami
      - name: Generate binding and Payload types
        run: npm run generate:types
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Deploy Worker application
        shell: bash
        run: set -o pipefail; npm run deploy:app 2>&1 | tee deploy-app.log
      - name: Apply D1 migrations
        run: npm run deploy:database
      - name: Upload deployment diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics-${{ github.run_id }}
          path: deploy-app.log
          if-no-files-found: ignore
          retention-days: 14
