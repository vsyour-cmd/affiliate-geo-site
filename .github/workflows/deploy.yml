name: Deploy production Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured in the production environment."
            exit 1
          fi
          NORMALIZED_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '(cfut_)?[A-Za-z0-9_-]{40,200}' | tail -n 1 || true)"
          if [ -z "$NORMALIZED_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN does not contain a valid raw API token. Save only the token value, without a variable name, JSON, or placeholder text."
            exit 1
          fi
          echo "::add-mask::$NORMALIZED_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$NORMALIZED_TOKEN" >> "$GITHUB_ENV"
          export CLOUDFLARE_API_TOKEN="$NORMALIZED_TOKEN"
          VERIFY_RESPONSE="$(curl --fail-with-body --silent --show-error https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $NORMALIZED_TOKEN")"
          if ! printf '%s' "$VERIFY_RESPONSE" | grep -q '"status":"active"'; then
            echo "::error::Cloudflare API token verification did not return active status."
            exit 1
          fi
      - name: Generate binding and Payload types
        run: npm run generate:types
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Deploy Worker application
        shell: bash
        run: set -o pipefail; npm run deploy:app 2>&1 | tee deploy-app.log
      - name: Apply D1 migrations
        run: npm run deploy:database
      - name: Upload deployment diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics-${{ github.run_id }}
          path: deploy-app.log
          if-no-files-found: ignore
          retention-days: 14
