name: Deploy production Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run generate:types
      - run: npm run lint
      - run: npm run typecheck
      - name: Deploy Worker application
        id: deploy_app
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run deploy:app 2>&1 | tee deploy-app.log
      - name: Report Worker deployment failure
        if: steps.deploy_app.outcome == 'failure'
        shell: bash
        run: |
          grep -Ei 'error|failed|exceeded|unauthorized|forbidden|D1|wrangler' deploy-app.log | tail -n 20 | sed 's/^/::error::/'
          exit 1
      - name: Apply D1 migrations
        run: npm run deploy:database
